[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-portscanner"
version = "1.1.0"
authors = [
  { name = "KKMHARI", email = "harichenda7902durga@gmail.com" },
]
description = "Fast, lightweight cross-platform TCP port scanner and banner grabber with zero external dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["port-scanner", "cybersecurity", "networking", "reconnaissance", "banner-grabbing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Topic :: Security",
]

[project.urls]
"Homepage" = "https://github.com/KKMHARI/Simple-portscaner"
"Bug Tracker" = "https://github.com/KKMHARI/Simple-portscaner/issues"

[project.scripts]
portscan = "portscan:main"
simple-portscan = "portscan:main"
